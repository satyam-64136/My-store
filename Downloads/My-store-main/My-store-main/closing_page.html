<!DOCTYPE html>
<html lang="en">
<head>
<meta name="google-site-verification" content="-HutJ6nTJtQrncUGREOpGZ0gY_hpEtf_C3OmptTRuec" />
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Satyam Store</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@300;400;500;700&family=Inter:wght@200;300&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --accent: #6ee7f7;
      --accent2: #a78bfa;
      --accent3: #f472b6;
      --fg: #f0f0f0;
      --fg-dim: rgba(240,240,240,0.35);
      --dark: #04040a;
    }

    html, body {
      height: 100%;
      width: 100%;
      overflow: hidden;
      background: var(--dark);
      font-family: 'Inter', sans-serif;
    }

    canvas#bg {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* Subtle grid overlay */
    .grid-overlay {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(110,231,247,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(110,231,247,0.025) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(ellipse at center, black 30%, transparent 80%);
    }

    .vignette {
      position: fixed;
      inset: 0;
      z-index: 2;
      pointer-events: none;
      background: radial-gradient(ellipse at center,
        transparent 25%,
        rgba(4,4,10,0.5) 70%,
        rgba(4,4,10,0.95) 100%
      );
    }

    /* Corner accents — thin L-shapes */
    .corner {
      position: fixed;
      width: 30px;
      height: 30px;
      z-index: 8;
      opacity: 0;
      animation: fadeIn 0.8s ease 2s forwards;
    }
    .corner::before, .corner::after {
      content: '';
      position: absolute;
      background: rgba(110,231,247,0.4);
    }
    .corner::before { width: 1px; height: 100%; }
    .corner::after  { width: 100%; height: 1px; }
    .corner.tl { top: 30px; left: 30px; }
    .corner.tr { top: 30px; right: 30px; }
    .corner.tr::before { right: 0; left: auto; }
    .corner.bl { bottom: 30px; left: 30px; }
    .corner.bl::before { top: auto; bottom: 0; }
    .corner.bl::after  { top: auto; bottom: 0; }
    .corner.br { bottom: 30px; right: 30px; }
    .corner.br::before { right: 0; left: auto; top: auto; bottom: 0; }
    .corner.br::after  { top: auto; bottom: 0; }

    /* Stage */
    .stage {
      position: relative;
      z-index: 10;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
      text-align: center;
    }

    /* Label */
    .label {
      font-family: 'Inter', sans-serif;
      font-weight: 300;
      font-size: clamp(9px, 0.9vw, 11px);
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: var(--accent);
      opacity: 0;
      animation: fadeUp 1s ease 0.5s forwards;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .label::before, .label::after {
      content: '';
      width: 28px;
      height: 1px;
      background: var(--accent);
      opacity: 0.5;
    }

    /* Headline */
    .headline {
      font-family: 'Syne', sans-serif;
      font-weight: 700;
      font-size: clamp(36px, 7vw, 96px);
      line-height: 1.05;
      color: var(--fg);
      letter-spacing: -0.02em;
      margin-top: 28px;
    }

    .line-wrap {
      overflow: hidden;
      display: block;
    }
    .line-wrap span {
      display: block;
      opacity: 0;
      transform: translateY(110%);
    }
    .line-wrap:nth-child(1) span { animation: slideUp 0.9s cubic-bezier(0.16,1,0.3,1) 0.85s forwards; }
    .line-wrap:nth-child(2) span { animation: slideUp 0.9s cubic-bezier(0.16,1,0.3,1) 1.0s forwards; }

    /* Gradient text for BOSE */
    .accent-word {
      display: inline-block;
      background: linear-gradient(120deg, var(--accent) 0%, var(--accent2) 50%, var(--accent3) 100%);
      background-size: 200% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      animation: chromaShift 5s ease-in-out 2s infinite;
    }
    @keyframes chromaShift {
      0%   { background-position: 0% 50%; }
      50%  { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    /* Divider */
    .divider {
      width: 0;
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(110,231,247,0.4), rgba(167,139,250,0.4), transparent);
      margin: 32px auto 0;
      animation: expandLine 1s ease 1.4s forwards;
    }
    @keyframes expandLine {
      to { width: clamp(120px, 28vw, 340px); }
    }

    /* Sub */
    .sub {
      font-family: 'Inter', sans-serif;
      font-weight: 200;
      font-size: clamp(10px, 1vw, 12px);
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--fg-dim);
      margin-top: 22px;
      opacity: 0;
      animation: fadeUp 1s ease 1.6s forwards;
    }

    /* Dot pulse */
    .dots {
      display: flex;
      gap: 8px;
      margin-top: 44px;
      opacity: 0;
      animation: fadeIn 0.8s ease 1.9s forwards;
    }
    .dot {
      width: 4px;
      height: 4px;
      border-radius: 50%;
    }
    .dot:nth-child(1) { background: var(--accent);  animation: pulse 2.2s ease-in-out 2.0s infinite; }
    .dot:nth-child(2) { background: var(--accent2); animation: pulse 2.2s ease-in-out 2.3s infinite; }
    .dot:nth-child(3) { background: var(--accent3); animation: pulse 2.2s ease-in-out 2.6s infinite; }

    @keyframes pulse {
      0%,100% { opacity: 0.2; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.8); }
    }

    /* Keyframes */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to   { opacity: 1; transform: none; }
    }
    @keyframes fadeIn {
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(110%); }
      to   { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <canvas id="bg"></canvas>
  <div class="grid-overlay"></div>
  <div class="vignette"></div>

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="stage">
    <p class="label">Satyam Store</p>

    <h1 class="headline">
      <span class="line-wrap"><span>Temporarily</span></span>
      <span class="line-wrap"><span>Closed. <span class="accent-word">Soon in 'BOSE'</span></span></span>
      <span class="line-wrap"><span style="font-weight:300; font-size:0.55em; letter-spacing:0.02em; color:rgba(240,240,240,0.55);">operating soon.</span></span>
    </h1>

    <div class="divider"></div>

    <p class="sub">Will be back &nbsp;·&nbsp; Stay tuned</p>

    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
  </div>

  <script>
    const canvas = document.getElementById('bg');
    const ctx = canvas.getContext('2d');
    let W, H, t = 0;

    function resize() {
      W = canvas.width  = window.innerWidth;
      H = canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    /* Orbs: cyan, purple, pink matching theme */
    const orbs = [
      { x:0.15, y:0.45, r:0.50, rgb:'30,180,220',  a:0.10, dx:0.00010, dy:0.00006 },
      { x:0.78, y:0.25, r:0.46, rgb:'120,80,240',  a:0.10, dx:-0.00008,dy:0.00009 },
      { x:0.55, y:0.78, r:0.38, rgb:'220,80,160',  a:0.08, dx:0.00007, dy:-0.00011 },
      { x:0.88, y:0.70, r:0.34, rgb:'60,180,255',  a:0.07, dx:-0.00009,dy:-0.00007 },
    ];

    function draw() {
      t++;
      ctx.clearRect(0,0,W,H);
      ctx.fillStyle = '#04040a';
      ctx.fillRect(0,0,W,H);

      orbs.forEach(o => {
        o.x += o.dx; o.y += o.dy;
        if (o.x < -0.1 || o.x > 1.1) o.dx *= -1;
        if (o.y < -0.1 || o.y > 1.1) o.dy *= -1;

        /* Slow organic drift via sine */
        const ox = Math.sin(t * 0.007 + o.r) * 0.04;
        const oy = Math.cos(t * 0.009 + o.r) * 0.03;
        const cx = (o.x + ox) * W;
        const cy = (o.y + oy) * H;
        const r  = o.r * Math.max(W, H);

        const g = ctx.createRadialGradient(cx,cy,0,cx,cy,r);
        g.addColorStop(0, `rgba(${o.rgb},${o.a})`);
        g.addColorStop(1, 'transparent');
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(cx,cy,r,0,Math.PI*2);
        ctx.fill();
      });

      /* Centre breathing glow */
      const p = 0.88 + 0.12 * Math.sin(t * 0.013);
      const cg = ctx.createRadialGradient(W/2,H/2,0,W/2,H/2,Math.min(W,H)*0.45*p);
      cg.addColorStop(0,'rgba(90,60,180,0.06)');
      cg.addColorStop(1,'transparent');
      ctx.fillStyle = cg;
      ctx.fillRect(0,0,W,H);

      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
